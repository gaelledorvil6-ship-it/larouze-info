name: Larouze INFO Cloud 24-7
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  larouze-cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg curl
      - name: Run Larouze Cloud Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          RUN_HOURLY: 'true'
        run: node cloud/larouze_cloud_engine.mjs
